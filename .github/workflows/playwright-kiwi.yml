name: Playwright Tests with Kiwi TCMS and TestRail

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testrail_run_id:
        description: 'TestRail run ID (optional)'
        required: false
        default: ''

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Get the code from GitHub
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project packages
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: python -m pip install --upgrade pip tcms-api

      - name: Verify tcms_api is importable
        run: python -c "import tcms_api; print('tcms_api OK', tcms_api.__file__)"

      - name: Generate BDD tests from feature files
        run: npx bddgen

      - name: Run Playwright tests and update Kiwi TCMS + TestRail
        env:
          KIWI_URL: ${{ secrets.KIWI_URL }}
          KIWI_USERNAME: ${{ secrets.KIWI_USERNAME }}
          KIWI_PASSWORD: ${{ secrets.KIWI_PASSWORD }}
          KIWI_PLAN_ID: ${{ secrets.KIWI_PLAN_ID }}
          TESTRAIL_URL: ${{ secrets.TESTRAIL_URL }}
          TESTRAIL_EMAIL: ${{ secrets.TESTRAIL_EMAIL }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7